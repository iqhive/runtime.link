name: Upstream sync

# Once a day, merges github.com/quaadgras/runtime.link main into qqmerge and
# fast-forwards main to it. A clean merge that passes the CI checks goes
# straight in. If the merge conflicts, or merges cleanly but fails the checks,
# Codex resolves it and bug-scrubs the new upstream code in the same pass, and
# the result has to pass the checks, on a fresh runner, before it is pushed. A failed attempt is
# saved to the qqmerge-failed branch and the run fails; scheduled runs then
# skip that upstream commit until upstream moves or someone reruns by hand.
#
# Building and testing the merged tree runs code that upstream and Codex
# wrote, and whatever has run on a runner can reach what later steps of its
# job are given. So each secret goes to a job where none of that code has run
# before it:
#
#   sync    merges, and checks a clean merge. No secret.
#   codex   makes the merge again without checking it, then runs Codex on it.
#           The only job given OPENAI_API_KEY.
#   verify  checks what Codex resolved. No secret.
#   push    pushes what the others bundled. The only job whose token can
#           write, and it runs nothing from the merge.
#
# The jobs hand the merge, or the failed attempt, on as a git bundle. What a
# job uploaded is unpacked in a directory of its own, where nothing is run.
#
# A merge that changes anything under .github is not pushed, however it came
# about: the push job takes its script from main, so that merge would decide
# what the next run does with the token. It is saved to qqmerge-failed like a
# failed attempt, for a person to review.
#
# Needs the repository secret OPENAI_API_KEY.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      codex:
        description: Run the Codex pass even if the merge is clean
        type: boolean
        default: false
      test_branch:
        description: 'Testing: merge this branch of this repo instead of quaadgras/main, and push nothing'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      TEST_BRANCH: ${{ inputs.test_branch }}
    outputs:
      pending: ${{ steps.sync.outputs.pending }}
      needs_codex: ${{ steps.sync.outputs.needs_codex }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'

      # Take the scripts from the commit this workflow runs from and keep them
      # outside the checkout, so that the merge can't change them.
      - name: Copy sync scripts
        run: git archive "$GITHUB_SHA" .github/upstream-sync | tar -x -C "$RUNNER_TEMP" --strip-components=1

      # A step that runs out of time has failed, and the steps below bundle the
      # attempt for the push job to save. A job that runs out of time is
      # cancelled, and leaves nothing: the next scheduled run would start the
      # same merge again. So the step that can take long ends before the job.
      - name: Merge quaadgras/main into qqmerge
        id: sync
        timeout-minutes: 50
        env:
          FORCE_CODEX: ${{ inputs.codex || false }}
        run: '"$RUNNER_TEMP/upstream-sync/sync.sh" prepare'

      # What the checks printed, for Codex to read.
      - name: Upload the log for the Codex job
        if: steps.sync.outputs.needs_codex == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-input
          retention-days: 7
          overwrite: true
          path: ${{ runner.temp }}/codex-input

      - name: Commit the clean merge for the push job
        if: steps.sync.outputs.pending == 'true' && steps.sync.outputs.needs_codex != 'true'
        env:
          BASE: ${{ steps.sync.outputs.base }}
          UPSTREAM: ${{ steps.sync.outputs.upstream }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: '"$RUNNER_TEMP/upstream-sync/sync.sh" commit'

      - name: Bundle the failed attempt for the push job
        if: failure() && steps.sync.outputs.pending == 'true'
        env:
          UPSTREAM: ${{ steps.sync.outputs.upstream }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: '"$RUNNER_TEMP/upstream-sync/sync.sh" package-failed'

      # Only one job of a run has a bundle for the push job: this one after a
      # clean merge or a failure, and the codex or verify job otherwise.
      - name: Upload the bundle for the push job
        if: ${{ !cancelled() && steps.sync.outputs.pending == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-result
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
          path: |
            ${{ runner.temp }}/merged.bundle
            ${{ runner.temp }}/failed.bundle

      - name: Upload the test merge
        if: always() && inputs.test_branch != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-sync-test-sync
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/test-merge.patch
            ${{ runner.temp }}/upstream-sync.log

  # Has Codex resolve the merge. The sync job may have run the merged code, so
  # this job starts on a runner of its own and makes the merge again: until
  # the Codex step, which is given the key, it builds and tests nothing.
  # codex-action then keeps the key from what Codex runs.
  codex:
    needs: sync
    if: needs.sync.outputs.needs_codex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      # Codex's sandbox can only write to the checkout and the system temp dir.
      GOCACHE: /tmp/go-build
      TEST_BRANCH: ${{ inputs.test_branch }}
    outputs:
      upstream: ${{ steps.merge.outputs.upstream }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          # Keeps the job's token out of .git/config, where Codex could read it.
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'

      # Take the scripts from the commit this workflow runs from and keep them
      # outside the checkout, so that neither the merge nor Codex can change them.
      - name: Copy sync scripts
        run: git archive "$GITHUB_SHA" .github/upstream-sync | tar -x -C "$RUNNER_TEMP" --strip-components=1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-input
          path: ${{ runner.temp }}/codex-input

      - name: Merge quaadgras/main into qqmerge again
        id: merge
        env:
          FORCE_CODEX: ${{ inputs.codex || false }}
        run: '"$RUNNER_TEMP/upstream-sync/sync.sh" remerge'

      # Ends before the job does, so that a pass that takes too long fails
      # and its attempt is bundled, see the sync job.
      - name: Resolve and bug-scrub with Codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        timeout-minutes: 50
        env:
          GOFLAGS: -mod=readonly
          GOPROXY: 'off'
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt-file: ${{ runner.temp }}/codex-prompt.md
          output-file: ${{ runner.temp }}/codex-summary.md
          effort: high

      - name: Package the Codex result for the verify job
        env:
          BASE: ${{ steps.merge.outputs.base }}
          UPSTREAM: ${{ steps.merge.outputs.upstream }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: '"$RUNNER_TEMP/upstream-sync/sync.sh" package'

      - name: Upload the Codex result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-result
          retention-days: 7
          overwrite: true
          path: |
            ${{ runner.temp }}/merge.bundle
            ${{ runner.temp }}/codex-summary.md

      - name: Bundle the failed attempt for the push job
        if: failure() && steps.merge.outputs.upstream != ''
        env:
          UPSTREAM: ${{ steps.merge.outputs.upstream }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: '"$RUNNER_TEMP/upstream-sync/sync.sh" package-failed'

      - name: Upload the bundle for the push job
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-result
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
          path: |
            ${{ runner.temp }}/failed.bundle

      - name: Upload the test merge
        if: always() && inputs.test_branch != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-sync-test-codex
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/test-merge.patch
            ${{ runner.temp }}/codex-prompt.md
            ${{ runner.temp }}/codex-summary.md
            ${{ runner.temp }}/upstream-sync.log

  # Checks what Codex resolved, when the codex job has succeeded. It runs on a
  # fresh runner because codex-action's drop-sudo locks down the root-owned
  # sockets under /run for the rest of the codex job, and go test stalls there.
  verify:
    needs: codex
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      TEST_BRANCH: ${{ inputs.test_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'

      - name: Copy sync scripts
        run: git archive "$GITHUB_SHA" .github/upstream-sync | tar -x -C "$RUNNER_TEMP" --strip-components=1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-result
          path: ${{ runner.temp }}/codex-result

      # Ends before the job does, so that checks that take too long fail and
      # the attempt is bundled, see the sync job.
      - name: Check the merge and bundle it for the push job
        timeout-minutes: 50
        env:
          UPSTREAM: ${{ needs.codex.outputs.upstream }}
        run: '"$RUNNER_TEMP/upstream-sync/sync.sh" verify'

      - name: Bundle the failed attempt for the push job
        if: failure()
        env:
          UPSTREAM: ${{ needs.codex.outputs.upstream }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: '"$RUNNER_TEMP/upstream-sync/sync.sh" package-failed'

      - name: Upload the bundle for the push job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-result
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
          path: |
            ${{ runner.temp }}/merged.bundle
            ${{ runner.temp }}/failed.bundle
            ${{ runner.temp }}/codex-summary.md

      - name: Upload the test merge
        if: always() && inputs.test_branch != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-sync-test-verify
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/test-merge.patch
            ${{ runner.temp }}/codex-summary.md
            ${{ runner.temp }}/upstream-sync.log

  # Pushes what the other jobs bundled. It is the only job whose token can
  # write, so it sets up no Go and runs nothing from the merge: it fetches the
  # bundle and moves the branches to the commit in it. The script it runs comes
  # from its own checkout, and the artifact is unpacked beside it, not over it.
  push:
    needs: [sync, codex, verify]
    if: ${{ !cancelled() && needs.sync.outputs.pending == 'true' && inputs.test_branch == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Copy sync scripts
        run: git archive "$GITHUB_SHA" .github/upstream-sync | tar -x -C "$RUNNER_TEMP" --strip-components=1

      # A run that failed before it had a merge uploaded nothing, and
      # save-failed says so.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: merge-result
          path: ${{ runner.temp }}/merge-result

      # A clean merge comes from the sync job, with the other two skipped.
      - name: Push qqmerge and main
        if: needs.sync.result == 'success' && (needs.verify.result == 'success' || (needs.codex.result == 'skipped' && needs.verify.result == 'skipped'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/upstream-sync/sync.sh" finalize'

      - name: Save the failed attempt to qqmerge-failed
        if: needs.sync.result == 'failure' || needs.codex.result == 'failure' || needs.verify.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/upstream-sync/sync.sh" save-failed'
